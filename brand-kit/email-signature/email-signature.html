<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>42 Coding Labs email signature</title>
<!--
  HOW TO USE
  1. Replace the three [bracketed] placeholders below (name, job title, phone).
  2. Open this file in a browser, select everything inside the dashed box, copy,
     and paste it into Gmail (Settings > See all settings > Signature) or
     Apple Mail (Settings > Signatures). Paste, do not type.
  The logo loads from the live site (www.42codinglabs.com/brand/icon-192.png),
  so it shows in every mail client without attachments.
  Inline styles and tables only: mail clients strip <style> blocks and flexbox.
-->
<style>
  /* preview page only: not part of the signature */
  body{margin:0;padding:48px;background:#F6F6FA;font-family:Arial,sans-serif;color:#5E5E72}
  .frame{background:#fff;border:1px dashed #C9C8D6;border-radius:8px;padding:28px 32px;max-width:560px}
  .help{font-size:13px;margin:0 0 16px}
</style>
</head>
<body>
<p class="help">Copy everything inside the box below into your mail client’s signature settings.</p>
<div class="frame">

<!-- SIGNATURE START -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Poppins,'Helvetica Neue',Arial,sans-serif;color:#12121C;">
  <tr>
    <td valign="top" style="padding:2px 16px 0 0;">
      <a href="https://42codinglabs.com" style="text-decoration:none;"><img src="https://www.42codinglabs.com/brand/icon-192.png" width="48" height="48" alt="42 Coding Labs" style="display:block;width:48px;height:48px;border:0;border-radius:11px;"></a>
    </td>
    <td valign="top" style="border-left:1px solid #E2E1EC;padding:0 0 0 16px;">
      <div style="font-size:15px;line-height:20px;font-weight:600;color:#12121C;">[Full name]</div>
      <div style="font-size:13px;line-height:19px;color:#5E5E72;">[Job title], 42 Coding Labs</div>
      <div style="font-size:13px;line-height:19px;color:#12121C;padding-top:8px;">
        <a href="mailto:hello@42codinglabs.com" style="color:#12121C;text-decoration:none;">hello@42codinglabs.com</a>
        <span style="color:#C9C8D6;">&nbsp;|&nbsp;</span>
        <span>+977 [phone number]</span>
      </div>
      <div style="font-size:13px;line-height:19px;">
        <a href="https://42codinglabs.com" style="color:#754DEC;text-decoration:none;font-weight:600;">42codinglabs.com</a>
        <span style="color:#5E5E72;">&nbsp;·&nbsp;Kathmandu, Nepal · Remote worldwide</span>
      </div>
      <div style="font-size:10px;line-height:18px;color:#9B9BAD;padding-top:6px;text-transform:uppercase;letter-spacing:1.4px;font-weight:500;">THINK. CODE. SHIP<span style="display:inline-block;width:5px;height:6px;margin-left:5px;background:#2BD4C0;border-radius:1px;"></span></div>
    </td>
  </tr>
</table>
<!-- SIGNATURE END -->

</div>
</body>
</html>
