<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>42 Coding Labs business card</title>
<link rel="stylesheet" href="../shared/brand.css">
<style>
/* Trim 85 x 55 mm, bleed 3 mm per side, safe area 4 mm inside trim.
   Default: bleed-only pages (91 x 61 mm). Open with #marks for crop marks (101 x 71 mm). */
@page{size:91mm 61mm;margin:0}
html.marks{--slug:5mm}
html{--slug:0mm}
.page{position:relative;width:calc(91mm + 2*var(--slug));height:calc(61mm + 2*var(--slug));overflow:hidden;page-break-after:always;background:#fff}
.page:last-child{page-break-after:auto}
.art{position:absolute;left:var(--slug);top:var(--slug);width:91mm;height:61mm;overflow:hidden}
.trim{position:absolute;left:3mm;top:3mm;width:85mm;height:55mm}

/* front */
.front{background:var(--black);
  background-image:radial-gradient(70mm 46mm at 92% 112%,rgba(117,77,236,.42),rgba(80,38,178,.12) 55%,transparent 75%)}
.front .lockup{position:absolute;left:50%;top:46%;width:52mm;transform:translate(-50%,-50%)}
.front .tag{position:absolute;left:6mm;bottom:5.5mm;font-size:5pt;font-weight:500;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.front .tag .tcur{width:.46em;height:.56em;margin-left:.5em;border-radius:.08em} /* small caps tagline: cursor sized to the cap height */
.front .url{position:absolute;right:6mm;bottom:5.5mm;font-size:6.5pt;color:var(--muted)}

/* back */
.back{background:var(--paper);color:var(--ink)}
.back .who{position:absolute;left:6mm;top:6mm}
.back .name{font-size:10pt;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.back .role{font-size:7pt;color:var(--muted-light);margin-top:1mm}
.back .mark{position:absolute;right:6mm;top:5.2mm;width:9mm}
.back .contact{position:absolute;left:6mm;bottom:5.5mm;font-size:7pt;line-height:1.65}
.back .contact b{display:inline-block;width:4.2mm;font-weight:500;color:var(--muted)}
.back .loc{position:absolute;right:6mm;bottom:5.5mm;font-size:6pt;color:var(--muted-light);text-align:right;line-height:1.5}
.back .rule{position:absolute;left:6mm;right:6mm;top:21mm;height:.25mm;background:var(--line-light)}

/* crop marks (only with #marks) */
.cm{display:none}
html.marks .cm{display:block;position:absolute;background:#000}
</style>
<script>const H=location.hash;
if(H.includes('marks')){document.documentElement.classList.add('marks');document.write('<style>@page{size:101mm 71mm}</style>')}
if(H.includes('flat')){document.write('<style>.front{background-image:none}</style>')} /* backup: plain near-black front, no violet glow */</script>
</head>
<body>

<!-- Page 1: front -->
<section class="page">
  <div class="art front">
    <div class="trim">
      <img class="lockup" src="../shared/logo/lockup-horizontal-on-dark.svg" alt="42 Coding Labs">
      <div class="tag">Think. Code. Ship<span class="tcur" aria-label="."></span></div>
    </div>
  </div>
  <div data-marks></div>
</section>

<!-- Page 2: back. Prajwal KC. -->
<section class="page">
  <div class="art back">
    <div class="trim">
      <div class="who">
        <div class="name">Prajwal KC</div>
        <div class="role">CTO, Co-founder</div>
      </div>
      <img class="mark" src="../shared/logo/mark-compact-on-light.svg" alt="">
      <div class="rule"></div>
      <div class="contact">
        <div><b>T</b><span>+977 970 2037055</span></div>
        <div><b>E</b>prajwal@42codinglabs.com</div>
        <div><b>W</b>42codinglabs.com</div>
      </div>
      <div class="loc">Kathmandu, Nepal<br>Working with teams worldwide</div>
    </div>
  </div>
  <div data-marks></div>
</section>

<script>
// Crop marks: 4 mm lines in the slug, 1 mm clear of the bleed, aligned to the trim.
if(document.documentElement.classList.contains('marks')){
  const s=5,b=3,len=4,gap=1,w=.1; // mm
  const W=91+2*s,H=61+2*s, xs=[s+b,W-s-b], ys=[s+b,H-s-b];
  const mk=(l,t,wd,ht)=>`<div class="cm" style="left:${l}mm;top:${t}mm;width:${wd}mm;height:${ht}mm"></div>`;
  document.querySelectorAll('[data-marks]').forEach(el=>{
    let h='';
    xs.forEach(x=>{h+=mk(x-w/2,s-gap-len,w,len)+mk(x-w/2,H-s+gap,w,len)});
    ys.forEach(y=>{h+=mk(s-gap-len,y-w/2,len,w)+mk(W-s+gap,y-w/2,len,w)});
    el.outerHTML=h;
  });
}
</script>
</body>
</html>
